<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

</head>

<style>
    #map {
        height: 500px;
    }

   const.popup-image {
        max-width: 200px;
        height: auto;
        object-fit: fill;
    }

    #locations {
        width: 250px;
    }

    .location {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        cursor: pointer;
    }

    .location:hover {
        background: #eee;
    }

    .container {
        display: flex;
        gap: 15px;
    }
</style>

<body>
    <h1>Simple Maps</h1>
    <div id="map"></div>

    <h3>Locations</h3>
    <div id="locations-list"></div>

    <div></div>
</body>

<script>

function initMap(mapDataUrl) {
    const map = L.map('map').setView([8.360, 124.868], 17);

    // OPENSTREETMAP LAYER
    const streets = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }
    );

    // Satellite layer
    const satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics, and GIS User Community'
        }
    );

    satellite.addTo(map);

    // Layer control
    const baseMaps = {
        "OpenStreetMap": streets,
        "Satellite": satellite
    };

    L.control.layers(baseMaps).addTo(map);

    // Render pins
    fetch(mapDataUrl)
        .then(response => response.json())
        .then(data => {

            data.forEach(pin => {
                const marker = L.marker([pin.lat, pin.lng]).addTo(map);

                const image = `<img src="${pin.image}" class="popup-image">`;

                marker.bindPopup(`
                    ${pin.title} <br>
                    <hr>
                    ${image}
                `);

                // Location list
                const item = document.createElement('div');
                item.className = 'location';
                item.textContent = pin.title;

                document.getElementById('locations-list').appendChild(item);

                // Fly to location
                item.onclick = () => {
                    map.flyTo([pin.lat, pin.lng], 18);
                    marker.openPopup();
                };
            });
        });
}

initMap('campus-map.json');

</script>
</html>
